<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle del Producto - BIKEMTB</title>
    <link rel="stylesheet" href="../public/styles/styles.css" />
  </head>
  <body>
    <header class="navbar">
      <nav class="container mx-auto">
        <div class="flex justify-between items-center">
          <a href="index.html" class="text-2xl font-bold text-yellow-500"
            >BikeMTB</a
          >
          <ul class="navbar-menu">
            <li><a href="index.html" class="navbar-link">Inicio</a></li>
            <li><a href="eventos.html" class="navbar-link">Eventos</a></li>
            <li><a href="catalogo.html" class="navbar-link">Catálogo</a></li>
            <li>
              <a href="promociones.html" class="navbar-link">Promociones</a>
            </li>
            <li><a href="nosotros.html" class="navbar-link">Nosotros</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="main-content container mx-auto px-4 py-8">
      <div class="bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6">
          <div class="flex justify-center items-center">
            <img
              id="producto-img"
              alt="Imagen del producto"
              class="max-w-full h-auto rounded-lg shadow"
            />
          </div>
          <div class="flex flex-col justify-center">
            <h2 id="producto-nombre" class="text-3xl font-bold mb-4"></h2>
            <p id="producto-descripcion" class="text-gray-700 mb-6 text-lg"></p>
            <p
              id="producto-precio"
              class="text-2xl font-bold text-blue-600 mb-6"
            ></p>
            <div class="flex flex-col sm:flex-row gap-4">
              <button
                class="bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition"
              >
                Agregar al carrito
              </button>
              <button
                class="border border-blue-600 text-blue-600 py-3 px-6 rounded-lg hover:bg-blue-50 transition"
              >
                Consultar disponibilidad
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center">
      <div class="container mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6">
          <div>
            <h3 class="text-xl font-bold mb-4">Contacto</h3>
            <p>Dirección: Calle Bike 123</p>
            <p>Celular: +123 456 789</p>
            <p>Email: info@bikemtb.com</p>
          </div>
          <div>
            <h3 class="text-xl font-bold mb-4">Síguenos</h3>
            <div class="flex justify-center gap-4">
              <a
                href="https://facebook.com/Tiendabike"
                target="_blank"
                rel="noopener"
                class="hover:text-yellow-500 transition"
                >Facebook</a
              >
              <a
                href="https://instagram.com/Tiendabike"
                target="_blank"
                rel="noopener"
                class="hover:text-yellow-500 transition"
                >Instagram</a
              >
              <a
                href="https://twitter.com/Tiendabike"
                target="_blank"
                rel="noopener"
                class="hover:text-yellow-500 transition"
                >Twitter</a
              >
            </div>
          </div>
        </div>
        <div class="border-t border-gray-700 pt-4">
          <p>© 2024 BikeMTB. Todos los derechos reservados.</p>
        </div>
      </div>
    </footer>

    <script src="./main.js"></script>
  </body>
</html>
